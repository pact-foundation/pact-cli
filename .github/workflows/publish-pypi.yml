# Publishes the release binaries to PyPI as `pact-python-cli`, repackaged
# into one wheel per platform by .github/scripts/build-wheels.py.
#
# Versions use PEP 440 epoch 1 (`1!<crate version>`) so they sort above the
# 2.x releases, which shipped the Ruby standalone tools from
# pact-foundation/pact-python.
#
# PyPI trusted publishing must list both release.yml (which calls this
# workflow) and publish-pypi.yml (for manual runs), with environment `pypi`.

name: Publish PyPI

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to PyPI (e.g. v0.10.9)'
        required: true
        type: string
      post:
        description: 'Post-release number for a packaging-only rebuild (e.g. 1 for .post1)'
        required: false
        type: string

jobs:
  build:
    name: Build Wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.version.outputs.enabled }}
    steps:
      - name: Resolve version
        id: version
        env:
          PLAN: ${{ inputs.plan }}
          MANUAL_TAG: ${{ inputs.tag }}
          POST: ${{ inputs.post }}
        run: |
          set -euo pipefail
          if [[ -n "$PLAN" ]]; then
            TAG="$(echo "$PLAN" | jq -r '.announcement_tag')"
            PRERELEASE="$(echo "$PLAN" | jq -r '.announcement_is_prerelease')"
          else
            TAG="$MANUAL_TAG"
            PRERELEASE=false
          fi

          if [[ "$PRERELEASE" == "true" || "$TAG" == *-* ]]; then
            echo "::notice::Skipping PyPI publish for prerelease ${TAG}"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="1!${TAG#v}"
          if [[ -n "$POST" ]]; then
            VERSION="${VERSION}.post${POST}"
          fi
          {
            echo "enabled=true"
            echo "tag=${TAG}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.version.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - name: Download release archives
        if: steps.version.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archives"
          cd "$RUNNER_TEMP/archives"
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" \
            -p 'pact-*-apple-darwin.tar.xz*' \
            -p 'pact-*-unknown-linux-*.tar.xz*' \
            -p 'pact-*-pc-windows-msvc.zip*'
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        if: steps.version.outputs.enabled == 'true'

      - name: Build wheels
        if: steps.version.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
          uv run --script .github/scripts/build-wheels.py \
            --version "$VERSION" \
            --archives "$RUNNER_TEMP/archives" \
            --readme README.md \
            --license LICENSE \
            --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: steps.version.outputs.enabled == 'true'
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.runner }})
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheels
          path: dist

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'

      # Installing by name from the wheel directory leaves pip to pick the
      # wheel for the host platform, as it does from PyPI.
      - name: Install and run
        shell: bash
        run: |
          set -euo pipefail
          pip install --no-index --find-links dist pact-python-cli
          pact --help

      - name: Install and run on Alpine
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" python:3-alpine sh -euc '
            pip install --root-user-action=ignore --no-index --find-links /dist pact-python-cli
            pact --help
          '

  publish:
    name: Publish to PyPI
    needs: [build, smoke]
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pact-python-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheels
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true
