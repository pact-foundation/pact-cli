# Publishes the release binaries to PyPI as `pact-python-cli`, repackaged
# into one wheel per platform by .github/scripts/build-wheels.py.
#
# Versions use PEP 440 epoch 1 (`1!<crate version>`) so they sort above the
# 2.x releases, which shipped the Ruby standalone tools from
# pact-foundation/pact-python.
#
# PyPI trusted publishing must list both release.yml (which calls this
# workflow) and publish-pypi.yml (for manual runs), with environment `pypi`.

name: Publish PyPI

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to PyPI (e.g. v0.10.9)'
        required: true
        type: string
      post:
        description: 'Post-release number for a packaging-only rebuild (e.g. 1 for .post1)'
        required: false
        type: string

jobs:
  build:
    name: Build Wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.version.outputs.enabled }}
    steps:
      - name: Resolve version
        id: version
        env:
          PLAN: ${{ inputs.plan }}
          MANUAL_TAG: ${{ inputs.tag }}
          POST: ${{ inputs.post }}
        run: |
          set -euo pipefail
          if [[ -n "$PLAN" ]]; then
            TAG="$(echo "$PLAN" | jq -r '.announcement_tag')"
            PRERELEASE="$(echo "$PLAN" | jq -r '.announcement_is_prerelease')"
          else
            TAG="$MANUAL_TAG"
            PRERELEASE=false
          fi

          if [[ "$PRERELEASE" == "true" || "$TAG" == *-* ]]; then
            echo "::notice::Skipping PyPI publish for prerelease ${TAG}"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="1!${TAG#v}"
          if [[ -n "$POST" ]]; then
            VERSION="${VERSION}.post${POST}"
          fi
          {
            echo "enabled=true"
            echo "tag=${TAG}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.version.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - name: Download release archives
        if: steps.version.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archives"
          cd "$RUNNER_TEMP/archives"
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" \
            -p 'pact-*-apple-darwin.tar.xz*' \
            -p 'pact-*-unknown-linux-*.tar.xz*' \
            -p 'pact-*-pc-windows-msvc.zip*'
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        if: steps.version.outputs.enabled == 'true'

      - name: Build wheels
        if: steps.version.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
          uv run --script .github/scripts/build-wheels.py \
            --version "$VERSION" \
            --archives "$RUNNER_TEMP/archives" \
            --readme README.md \
            --license LICENSE \
            --out dist

      - name: Smoke test
        if: steps.version.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" dist/*-manylinux_2_34_x86_64.whl
          "$RUNNER_TEMP/venv/bin/pact" --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: steps.version.outputs.enabled == 'true'
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pact-python-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheels
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true
