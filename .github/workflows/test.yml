---
name: Test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: '1'
  FORCE_COLOR: '1'
  CARGO_TERM_COLOR: always

jobs:
  complete:
    name: Test completion check
    if: always()
    runs-on: ubuntu-latest
    needs:
      - format
      - lint
      - test
      - npm
    steps:
      - name: Failed
        run: exit 1
        if: |
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')

  format:
    name: Format
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  lint:
    name: Lint
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8  # v2.87.28
        with:
          tool: cargo-nextest
      - name: Run tests
        run: cargo nextest run

  npm:
    name: npm wrapper (${{ matrix.os }}, node ${{ matrix.node }})
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'
          - os: ubuntu-latest
            node: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        if: matrix.node == '24'
        run: node --test 'npm/test/*.test.js'
      # node:test and fs.cpSync postdate Node 16, so the engines floor only
      # checks that the wrapper loads and reports the missing platform package.
      - name: Check wrapper on Node 16
        if: matrix.node == '16'
        shell: bash
        run: |
          status=0
          node npm/pact-cli/bin/pact.js --version 2> stderr.txt || status=$?
          cat stderr.txt
          test "$status" -eq 1
          grep -q '@pact-foundation/pact-cli-' stderr.txt
