name: Notify Homebrew tap

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.10.3)'
        required: true
        type: string

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        env:
          PLAN: ${{ inputs.plan }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            TAG="$(echo "$PLAN" | jq -r '.announcement_tag')"
          else
            TAG="$MANUAL_TAG"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.PACT_FOUNDATION_BOT_APP_ID }}
          private-key: ${{ secrets.PACT_FOUNDATION_BOT_PRIVATE_KEY }}
          owner: pact-foundation
          repositories: homebrew-tap
      - name: Dispatch to homebrew-tap
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: pact-foundation/homebrew-tap
          event-type: pact-cli-released
          client-payload: |
            {
              "version": "${{ steps.version.outputs.version }}",
              "type": "pact-cli-released"
            }
