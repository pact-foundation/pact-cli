[workspace]
pr_draft = true
git_release_enable = false
publish = true

[changelog]
protect_breaking_commits = false
tag_pattern = 'v[0-9]+\.[0-9]+\.[0-9]+'
sort_commits = "oldest"

commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/pact-foundation/pact-cli/issues/${2}))" },
  # Link bundled CLI updates to the upstream release notes.
  { pattern = 'pact-broker-cli to v?([0-9][^\s]*)', replace = "pact-broker-cli to [v${1}](https://github.com/pact-foundation/pact-broker-cli/releases/tag/v${1})" },
  { pattern = 'pact_mock_server_cli to v?([0-9][^\s]*)', replace = "pact_mock_server_cli to [v${1}](https://github.com/pact-foundation/pact-core-mock-server/releases/tag/pact_mock_server_cli-v${1})" },
  { pattern = 'pact-plugin-cli to v?([0-9][^\s]*)', replace = "pact-plugin-cli to [v${1}](https://github.com/pact-foundation/pact-plugins/releases/tag/pact-plugin-cli-v${1})" },
  { pattern = 'pact-stub-server to v?([0-9][^\s]*)', replace = "pact-stub-server to [v${1}](https://github.com/pact-foundation/pact-stub-server/releases/tag/v${1})" },
  { pattern = 'pact_verifier_cli to v?([0-9][^\s]*)', replace = "pact_verifier_cli to [v${1}](https://github.com/pact-foundation/pact-reference/releases/tag/pact_verifier_cli-v${1})" },
]

commit_parsers = [
  # Updates to the bundled CLIs change `pact` subcommand behaviour, so they must
  # match before the generic dependency skip below.
  { group = "<!-- 02 -->🧩 Bundled CLIs", message = "^(chore|fix)\\(deps.*\\): update .*(pact-broker-cli|pact_mock_server_cli|pact-plugin-cli|pact-stub-server|pact_verifier_cli)" },
  { message = "^(chore|fix)\\(deps.*\\)", skip = true },
  { group = "<!-- 00 -->🚀 Features", message = "^feat" },
  { group = "<!-- 01 -->🐛 Bug Fixes", message = "^fix" },
  { group = "<!-- 50 -->🚜 Refactor", message = "^refactor" },
  { group = "<!-- 51 -->⚡️ Performance", message = "^perf" },
  { group = "<!-- 52 -->🎨 Styling", message = "^style" },
  { group = "<!-- 60 -->📚 Documentation", message = "^docs" },
  { group = "<!-- 80 -->🧪 Testing", message = "^test" },
  { group = "<!-- 98 -->↩️ Revert", message = "^revert" },
  { group = "<!-- 99 -->🛠️ Miscellaneous Tasks", message = "^chore" },
  { group = "<!-- 99 -->📦 Other", message = ".*" },
]

trim = true
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version -%}
  ## [{{ version | trim_start_matches(pat="v") }}] _{{ timestamp | date(format="%Y-%m-%d") }}_

{% else -%}
  ## [unreleased]

{% endif -%}
{% for group, commits in commits | group_by(attribute="group") -%}
    ### {{ group | striptags | trim | upper_first }}

    {% for commit in commits -%}
        - {% if commit.scope %}_({{ commit.scope }})_ {% endif -%}
          {% if commit.breaking %}[**breaking**] {% endif -%}
          {{ commit.message | upper_first }}
    {% endfor %}
{% endfor -%}
"""
