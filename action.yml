name: pact
description: Install the Pact consolidated CLI (mock server, verifier, stub server, plugin and broker tools in a single binary).
inputs:
  version:
    description: >-
      Deprecated. Pin the version via the action ref instead:
      uses: pact-foundation/pact-cli@vX.Y.Z
    required: false
    default: ''
    deprecationMessage: >-
      The 'version' input is deprecated. Pin the version via the action ref instead:
      uses: pact-foundation/pact-cli@vX.Y.Z

runs:
  using: "composite"
  steps:
    - name: Install pact (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        EXPLICIT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        if [ -n "$EXPLICIT_VERSION" ] && [ "$EXPLICIT_VERSION" != "vlatest" ]; then
          RESOLVED_VERSION="$EXPLICIT_VERSION"
        elif echo "$ACTION_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]'; then
          RESOLVED_VERSION="$ACTION_REF"
        else
          RESOLVED_VERSION=""
        fi

        if [ -z "$RESOLVED_VERSION" ]; then
          BASE_URL="https://github.com/pact-foundation/pact-cli/releases/latest/download"
        else
          BASE_URL="https://github.com/pact-foundation/pact-cli/releases/download/${RESOLVED_VERSION}"
        fi

        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)  TARGET="x86_64-unknown-linux-gnu" ;;
          Linux-aarch64|Linux-arm64) TARGET="aarch64-unknown-linux-gnu" ;;
          Darwin-x86_64) TARGET="x86_64-apple-darwin" ;;
          Darwin-arm64|Darwin-aarch64) TARGET="aarch64-apple-darwin" ;;
          *) echo "Unsupported platform: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
        esac

        # Download the release archive and verify it against its published
        # checksum instead of piping an installer script into a shell.
        WORK_DIR="$(mktemp -d)"
        trap 'rm -rf "$WORK_DIR"' EXIT
        ARCHIVE="pact-${TARGET}.tar.xz"
        curl --proto '=https' --tlsv1.2 -fsSL -o "$WORK_DIR/$ARCHIVE" "$BASE_URL/$ARCHIVE"
        curl --proto '=https' --tlsv1.2 -fsSL -o "$WORK_DIR/$ARCHIVE.sha256" "$BASE_URL/$ARCHIVE.sha256"
        (cd "$WORK_DIR" && if command -v sha256sum >/dev/null 2>&1; then sha256sum --check --strict "$ARCHIVE.sha256"; else shasum -a 256 --check "$ARCHIVE.sha256"; fi)

        INSTALL_DIR="$HOME/.local/bin"
        mkdir -p "$INSTALL_DIR"
        tar -xJf "$WORK_DIR/$ARCHIVE" -C "$WORK_DIR"
        install -m 0755 "$WORK_DIR/pact-${TARGET}/pact" "$INSTALL_DIR/pact"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Install pact (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $explicitVersion = "${{ inputs.version }}"
        $actionRef = "${{ github.action_ref }}"

        if (-not [string]::IsNullOrEmpty($explicitVersion) -and $explicitVersion -ne "vlatest") {
          $resolvedVersion = $explicitVersion
        } elseif ($actionRef -match '^v\d+\.\d+\.\d+') {
          $resolvedVersion = $actionRef
        } else {
          $resolvedVersion = ""
        }

        if ([string]::IsNullOrEmpty($resolvedVersion)) {
          $url = "https://github.com/pact-foundation/pact-cli/releases/latest/download/pact-installer.ps1"
        } else {
          $url = "https://github.com/pact-foundation/pact-cli/releases/download/$resolvedVersion/pact-installer.ps1"
        }
        irm $url | iex

    - name: Add pact bin to PATH (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: echo "$HOME/.pact/bin" >> "$GITHUB_PATH"

    - name: Add pact bin to PATH (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.pact\bin"
